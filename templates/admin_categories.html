<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Category CSS -->
  <link rel="stylesheet" href="{{url_for('static',filename='css/admin_categories.css')}}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/Admin_dashboard">
      Admin Panel – Digital Quiz Hub
    </a>
    <a href="/Logout" class="btn btn-outline-primary btn-sm">Logout</a>
  </div>
</nav>

<!-- ===== CATEGORY MANAGEMENT ===== -->
<section class="category-management py-5">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Category Management</h2>
      <input type="text" id="searchCategory" class="form-control w-25"
             placeholder="Search category">
    </div>

    <!-- Add Category -->
     <form action="/addCategory" method="POST">
    <div class="add-category mb-4">
      <div class="input-group">
        <input type="text" id="categoryName" class="form-control" name="Category"
               placeholder="Enter new category name">
        <button type="submit"  class="btn btn-primary" >Add Category</button>
      </div>
    </div>
    </form>

    <!-- Category Table -->
    <div class="table-responsive">
      <table class="table align-middle text-center">
        <thead>
          <tr>
            <th>#</th>
            <th>Category Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="categoryTable">
          <!-- JS injects rows -->
        </tbody>
      </table>
    </div>

    <!-- Output -->
    <div id="categoryOutput" class="mt-4"></div>

  </div>
</section>
 <script src="{{url_for('static',filename='js/admin_categories.js')}}"></script>
</body>
</html>
