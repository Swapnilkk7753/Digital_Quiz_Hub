<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Management | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Quiz CSS -->
  <link rel="stylesheet" href="{{url_for('static',filename='css/admin_quizzes.css')}}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/Admin_dashboard">
      Admin Panel – Digital Quiz Hub
    </a>
    <a href="/Logout" class="btn btn-outline-primary btn-sm">Logout</a>
  </div>
</nav>

<!-- ===== QUIZ MANAGEMENT ===== -->
<section class="quiz-management py-5">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Quiz Management</h2>
      <input type="text" id="searchQuiz" class="form-control w-25"
             placeholder="Search quiz">
    </div>

    <!-- Add Quiz -->
     <form action="/addquizzes" method="post">
    <div class="add-quiz mb-4">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" id="quizTitle" class="form-control" name="Quizz_Title"
                 placeholder="Quiz title">
        </div>
        <div class="col-md-3">
          <select id="quizCategory" class="form-control" name="Category">
            <option value="">Select Category</option>
            {%for cat in cate%}
            <option value={{cat[1]}}>{{cat[1]}}</option>
            {%endfor%}
          </select>
        </div>
        <div class="col-md-2">
          <input type="number" id="quizTime" class="form-control" name="Time"
                 placeholder="Time (min)">
        </div>
        <div class="col-md-2">
          <button  type="submit" class="btn btn-primary w-100" >
            Add Quiz
          </button>
        </div>
      </div>
    </div>
    </form>

    <!-- Quiz Table -->
    <div class="table-responsive">
      <table class="table align-middle text-center">
        <thead>
          <tr>
            <th>#</th>
            <th>Quiz Title</th>
            <th>Category</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="quizTable">
          <!-- JS injects rows -->
        </tbody>
      </table>
    </div>

    <!-- Output -->
    <div id="quizOutput" class="mt-4"></div>

  </div>
</section>

<script src="{{url_for('static',filename='js/admin_quizzes.js')}}"></script>
</body>
</html>
