<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Management | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Question CSS -->
  <link rel="stylesheet" href="{{url_for('static',filename='css/admin_questions.css')}}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/Admin_dashboard">
      Admin Panel – Digital Quiz Hub
    </a>
    <a href="/Logout" class="btn btn-outline-primary btn-sm">Logout</a>
  </div>
</nav>

<!-- ===== QUESTION MANAGEMENT ===== -->
<section class="question-management py-5">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Question Management</h2>
      <input type="text" id="searchQuestion" class="form-control w-25"
             placeholder="Search question">
    </div>

    <!-- ADD QUESTION -->
     <form action="/addquestions" method="post">
      <div class="add-question mb-5">
        <div class="card p-4">

        <h5 class="mb-3">Add New Question</h5>

        <div class="mb-3">
          <select id="quizSelect" class="form-control" name="Quiz">
            <option value="">Select Quiz</option>
            {%for quiz in quizz%}
            <option value='{{quiz[1]}}'>{{quiz[1]}}</option>
            {%endfor%}
          </select>
        </div>

        <div class="mb-3">
          <textarea id="questionText" class="form-control" name="Question"
            placeholder="Enter question text"></textarea>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input type="text" id="optA" class="form-control" name="Op1" placeholder="Option A">
          </div>
          <div class="col-md-6">
            <input type="text" id="optB" class="form-control" name="Op2" placeholder="Option B">
          </div>
          <div class="col-md-6">  
            <input type="text" id="optC" class="form-control" name="Op3" placeholder="Option C">
          </div>
          <div class="col-md-6">
            <input type="text" id="optD" class="form-control" name="Op4" placeholder="Option D">
          </div>
        </div>

        <div class="mb-3">
          <select id="correctOption" class="form-control" name="C_op">
            <option value="">Correct Answer</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" >Add Question</button>
      </div>
    </div>
    </form>

    <!-- QUESTION TABLE -->
    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="text-center">
          <tr>
            <th>#</th>
            <th>Quiz</th>
            <th>Question</th>
            <th>Correct</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="questionTable">
          <!-- JS injects -->
        </tbody>
      </table>
    </div>

    <!-- OUTPUT -->
    <div id="questionOutput" class="mt-4"></div>

  </div>
</section>

<script src="{{url_for('static',filename='js/admin_questions.js')}}"></script>
</body>
</html>
