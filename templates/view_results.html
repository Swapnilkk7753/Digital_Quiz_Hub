<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Quizzes | Digital Quiz Hub</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Page CSS -->
  <link rel="stylesheet" href="{{url_for('static',filename='css/my_quizzes.css')}}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/My_quizzes">
      Digital Quiz Hub
    </a>
  </div>
</nav>

<!-- ===== PAGE HEADER ===== -->
<section class="page-header">
  <div class="container text-center">
    <h1>Quiz Result</h1>
    <p>Attempted Question and results</p>
  </div>
</section>

<!-- ===== QUIZ TABLE ===== -->
<section class="quiz-section py-5">
  <div class="container">

    <div class="table-responsive">
      <table class="table quiz-table align-middle text-center">
        <thead>
          <tr>
            <th>Question No.</th>
            <th>Question Name</th>
            <th>Option</th>
            <th>Correct Option</th>
            <th>Score</th>
          </tr>
        </thead>

        <tbody id="quizTableBody">
          {%for i in rw%} 
          <tr>
            <td>{{loop.index}}</td>
            <td>{{i[5]}}</td>
            <td>{{i[6]}}</td>
            <td>{{i[7]}}</td>
            <td>{{i[9]}}</td>
          </tr>
          {%endfor%}

          
        </tbody>
      </table>
    </div>

  </div>
</section>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Page JS -->
<script src="{{url_for('static',filename='js/my_quizzes.js')}}"></script>
</body>
</html>
