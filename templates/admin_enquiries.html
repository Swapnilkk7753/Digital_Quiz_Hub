<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiries | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Enquiries CSS -->
  
    <link rel="stylesheet" href="{{url_for('static',filename='css/admin_enquiries.css')}}">

</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/Admin_dashboard">
      Admin Panel – Digital Quiz Hub
    </a>
    <a href="/Logout" class="btn btn-outline-primary btn-sm">Logout</a>
  </div>
</nav>

<!-- ===== ENQUIRIES MANAGEMENT ===== -->
<section class="enquiry-management py-5">
  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>User Enquiries & Feedback</h2>
      <input type="text" id="searchEnquiry" class="form-control w-25"
             placeholder="Search name or email">
    </div>

    <!-- Enquiry Table -->
    <div class="table-responsive">
      <table class="table align-middle text-center">
        <thead>
          <tr>
            <th>#</th>
            <th>User Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="enquiryTable">
          <!-- JS injects rows -->
        </tbody>
      </table>
    </div>

    <!-- Output -->
    <div id="enquiryOutput" class="mt-4"></div>

  </div>
</section>

<script src="{{url_for('static',filename='js/admin_enquiries.js')}}"></script>
</body>
</html>
