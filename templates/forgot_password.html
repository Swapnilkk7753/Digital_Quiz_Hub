<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Digital Quiz Hub</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
    <link rel="stylesheet" href="{{url_for('static',filename='css/forgot_password.css')}}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light py-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/Index">Digital Quiz Hub</a>
  </div>
</nav>

<!-- ===== FORGOT PASSWORD SECTION ===== -->
<section class="forgot-section">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-md-6 col-lg-5">
        <div class="forgot-card">

          <h2 class="text-center mb-3">Forgot Password?</h2>
          <p class="text-center text-muted mb-4">
            Enter your registered email address.  
            We’ll help you reset your password.
          </p>

          <form action="/ForgotUser" method="POST">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" name="Email" class="form-control" id="em1" placeholder="Enter your email">
            </div>
            <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" id="p" placeholder="Enter New Password" required>
        </div>

        <div class="mb3" style="margin-bottom: 10px;">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" id="cp" placeholder="Confirm Password"  required>
        </div>

            <button type="submit" onclick="forgot()" class="btn btn-primary w-100">
              Send Reset Link
            </button>
          </form>

          <p class="text-center mt-3">
            Remember your password?
            <a href="/Login">Back to Login</a>
          </p>

        </div>
      </div>

    </div>
  </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="{{url_for('static',filename='js/forgot.js')}}"></script>

</body>
</html>
