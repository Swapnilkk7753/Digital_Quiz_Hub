<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anchor Tag Example</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            background-color: #0d6efd;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffd700;
        }

        /* Container */
        .container {
            padding: 40px;
            text-align: center;
        }

        /* Button Anchor */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #198754;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #145c32;
        }

        /* Section */
        section {
            margin-top: 80px;
            padding: 60px;
            background-color: #ffffff;
            border-radius: 10px;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            background-color: #212529;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        footer a {
            color: #0dcaf0;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <a href="/Admin_dashboard">admin</a>
        <a href="/Dashboard">user dashboard</a>
        <a href="/Quiz_attemp">quiz attempt</a>
        <a href="/Quizzes">quizzes</a>
        <a href="/Result">result</a>



        <a href="https://google.com" target="_blank">External Link</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1>Anchor Tag Demo</h1>
        <p>This page demonstrates different uses of anchor tags.</p>

        <!-- Button Anchor -->
        <a href="/About" class="btn">Go to About Section</a>
    </div>

    <!-- About Section -->
    <section id="about">
        <h2>About Section</h2>
        <p>
            This section is opened using an anchor tag with ID navigation.
        </p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Section</h2>
        <p>
            <a href="mailto:support@example.com">Send Email</a><br><br>
            <a href="tel:+919876543210">Call Us</a>
        </p>
    </section>

    <!-- Footer -->
